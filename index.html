<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<title>event-horizon_</title>
<style>
  :root {
    --bg: #0b0f12;
    --bg-raised: #11171d;
    --accent: #00f0ff;
    --accent-dim: #04bac5;
    --accent-faint: #123038;
    --text: #c5d8e0;
    --text-dim: #cdcdcd;
    --border: #1a2630;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 16px;
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0, 240, 255, 0.01) 0px,
      rgba(0, 240, 255, 0.01) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .wrap { max-width: 700px; margin: 0 auto; }

  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.4rem 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.2rem;
    margin-bottom: 2.2rem;
  }

  .header .prompt {
    color: var(--accent-dim);
    font-size: 0.9rem;
  }

  @media (max-width: 520px) {
    .header {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
    }

    .header .prompt {
      font-size: 0.78rem;
      line-height: 1.3;
    }
  }

  .header h1 {
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .header h1::after {
    content: '_';
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .nav button:hover { border-color: var(--accent-dim); color: var(--accent); }
  .nav button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  .nav .month-label {
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: 0.03em;
  }

  .day-group { margin-bottom: 1.8rem; }

  .day-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 0.6rem;
  }

  .day-header .date-num { color: var(--text); }

  .day-header.is-today .date-num { color: var(--accent); font-weight: 600; }
  .day-header.is-today::before {
    content: '▸';
    color: var(--accent);
  }

  .day-header .rule {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .event {
    display: flex;
    align-items: center; 
    gap: 0.8rem;
    padding: 0.4rem 0 0.4rem 1.2rem;
    font-size: 1rem;
    border-left: 1px solid var(--border);
  }

  .event .thumb {
    width: 5.2rem;
    height: 5.2rem;
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg-raised);
  }

  .img-preview {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    border: 1px solid var(--accent-dim);
    background: var(--bg-raised);
    padding: 5px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }

  .img-preview.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .img-preview img {
    display: block;
    max-width: 200px;
    max-height: 260px;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  @media (hover: none) {
    .img-preview { display: none; }
  }

  .event-info {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
    flex: 1;
  }

  /* Contenitore per icona e titolo allineati perfettamente */
  .event-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .event .icon {
    color: var(--accent-dim);
    flex-shrink: 0;
    text-align: center;
  }

  .event a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dotted var(--border);
  }

  .event a:hover { color: var(--accent); border-bottom-color: var(--accent-dim); }

  .event-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
    margin-top: 0;
  }

  .event:hover .event-tags {
    max-height: 150px;
    opacity: 1;
    margin-top: 0.2rem;
  }

  .event-tags .tag {
    color: var(--text-dim);
    font-size: 0.72rem;
    border: 1px solid var(--border);
    padding: 0.1rem 0.5rem;
    letter-spacing: 0.02em;
    text-transform: lowercase;
  }

  .filters {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .type-filters {
    display: flex;
    gap: 0.4rem;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 1rem;
    line-height: 1;
    padding: 0.4rem 0.55rem;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }

  .filter-btn.active {
    opacity: 1;
    border-color: var(--accent-dim);
  }

  .filter-btn:hover { border-color: var(--accent-dim); }
  .filter-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  .tag-toggle,
  .clear-filters {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .tag-toggle:hover,
  .clear-filters:hover { border-color: var(--accent-dim); color: var(--accent); }
  .tag-toggle.has-selection { border-color: var(--accent-dim); color: var(--accent); }

  .clear-filters { color: var(--accent-dim); margin-left: auto; }

  .tag-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 0.8rem;
    margin-bottom: 1.4rem;
    border: 1px dashed var(--border);
  }

  .tag-panel[hidden] { display: none; }

  .tag-chip {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.72rem;
    padding: 0.25rem 0.6rem;
    letter-spacing: 0.02em;
    text-transform: lowercase;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .tag-chip:hover { border-color: var(--accent-dim); }

  .tag-chip.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 1rem;
    padding: 2rem 0;
    text-align: center;
    border: 1px dashed var(--border);
  }

  .footer-note {
    margin-top: 3.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.75rem;
    line-height: 1.6;
  }

  .footer-note a {
    color: var(--accent-dim);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent-dim);
  }

  .footer-note a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .header h1::after { animation: none; }
    .event-tags { transition: none; }
  }
</style>
<script>
  let showUnderscore = true;
  setInterval(() => {
    document.title = showUnderscore ? "event-horizon_" : "event-horizon";
    showUnderscore = !showUnderscore;
  }, 550); // Speed
</script>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>releases.log</h1>
    <span class="prompt">hype-sharing, community-based sci-fi cyber-feed</span>
  </div>

  <div class="filters">
    <div class="type-filters" id="typeFilters"></div>
    <button class="tag-toggle" id="tagToggle" aria-expanded="false">tags ▾</button>
    <button class="clear-filters" id="clearFilters" hidden>clear ×</button>
  </div>

  <div class="tag-panel" id="tagPanel" hidden></div>

  <div class="nav">
    <button id="prevMonth" aria-label="Previous month">&larr; prev</button>
    <span class="month-label" id="monthLabel">—</span>
    <button id="nextMonth" aria-label="Next month">next &rarr;</button>
  </div>

  <div id="calendar"></div>

  <div class="footer-note">
    type → icon: game 🎮 · anime 📺 · movie 🎬 · series 📼 · manga 📖 · album 💽
    · <a href="submit.html">submit a missing release</a>
  </div>

</div>

<script>
  const ICONS = { game: '🎮', anime: '📺', movie: '🎬', series: '📼', manga: '📖', album: '💽' };
  const MONTHS = ['january','february','march','april','may','june','july',
                  'august','september','october','november','december'];

  const TODAY = new Date();
  TODAY.setHours(0, 0, 0, 0);
  let currentYear = TODAY.getFullYear();
  let currentMonth = TODAY.getMonth();

  function monthKey(year, month) {
    return `${year}-${String(month + 1).padStart(2, '0')}`;
  }

  const TAG_LABELS_SOURCE = [
    'Aliens & First Contact',
    'Biopunk & Genetic Engineering',
    'Corporate Governments & Techno-Religions',
    'Cyberpunk',
    'Dystopian',
    'Hard Sci-Fi',
    'Kaiju & Tokusatsu',
    'Mecha',
    'Megastructures (Dyson spheres, orbital cities)',
    'Mind Control, Collective Consciousness & Telepathy',
    'Post-Apocalyptic & Alternative Histories',
    'Space Opera & Interplanetary Warfare',
    'Speculative Tech, Cybernetics, AI & Robotics',
    'Steampunk & Retrofuturism',
    'Time Travel & Space Exploration',
    'Transhumanism, Post-humanism & Mind Uploading',
    'Virtual Realities, Simulation & Multiverses',
  ];

  function slugify(tagText) {
    const cleanName = tagText.split(' (')[0];
    return cleanName
      .toLowerCase()
      .replaceAll(' & ', '-')
      .replaceAll(', ', '-')
      .replaceAll(' ', '-');
  }

  const TAG_LABELS = Object.fromEntries(
    TAG_LABELS_SOURCE.map((t) => [slugify(t), t])
  );

  function formatTagLabel(slug) {
    if (TAG_LABELS[slug]) return TAG_LABELS[slug];
    return slug
      .split('-')
      .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
  }

  function isSafeHttpUrl(value) {
    try {
      const u = new URL(value, window.location.href);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch {
      return false;
    }
  }

  // --- Anteprima immagine on-hover ---
  const imgPreview = document.createElement('div');
  imgPreview.className = 'img-preview';
  const imgPreviewImg = document.createElement('img');
  imgPreview.appendChild(imgPreviewImg);
  document.body.appendChild(imgPreview);

  function showImgPreview(thumbEl, src) {
    if (imgPreviewImg.src !== src) imgPreviewImg.src = src;
    imgPreview.classList.add('visible');
    positionImgPreview(thumbEl);
  }

  function positionImgPreview(thumbEl) {
    const rect = thumbEl.getBoundingClientRect();
    const margin = 10;
    const previewRect = imgPreview.getBoundingClientRect();
    const pw = previewRect.width || 210;
    const ph = previewRect.height || 210;

    let left = rect.right + margin;
    if (left + pw > window.innerWidth) {
      left = rect.left - pw - margin;
    }
    left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

    let top = rect.top;
    if (top + ph > window.innerHeight - margin) {
      top = window.innerHeight - ph - margin;
    }
    top = Math.max(margin, top);

    imgPreview.style.left = `${left}px`;
    imgPreview.style.top = `${top}px`;
  }

  function hideImgPreview() {
    imgPreview.classList.remove('visible');
  }

  window.addEventListener('scroll', hideImgPreview, { passive: true });

  function isToday(dateStr) {
    return dateStr === TODAY.toISOString().slice(0, 10);
  }

  function isPast(dateStr) {
    return new Date(dateStr) < TODAY && !isToday(dateStr);
  }

  async function loadMonth(year, month) {
    const key = monthKey(year, month);
    try {
      const resp = await fetch(`data/${key}.json`, { cache: 'no-cache' });
      if (!resp.ok) return [];
      return await resp.json();
    } catch (err) {
      console.warn(`Could not load data/${key}.json`, err);
      return [];
    }
  }

  function render(events) {
    const label = document.getElementById('monthLabel');
    label.textContent = `${MONTHS[currentMonth]} ${currentYear}`;

    const container = document.getElementById('calendar');
    container.innerHTML = '';

    if (events.length === 0) {
      const msg = currentEvents.length > 0
        ? 'no releases match the current filters'
        : 'no releases logged for this month';
      container.innerHTML = `<div class="empty-state">${msg}</div>`;
      return;
    }

    const byDay = {};
    for (const ev of events) {
      (byDay[ev.date] ||= []).push(ev);
    }

    for (const [dateStr, dayEvents] of Object.entries(byDay).sort()) {
      const d = new Date(dateStr);
      const dayNum = d.getDate();
      const today = isToday(dateStr);

      const dayHeader = document.createElement('div');
      dayHeader.className = 'day-header' + (today ? ' is-today' : '');
      dayHeader.innerHTML = `<span class="date-num">${String(dayNum).padStart(2,'0')}</span>
        <span class="rule"></span>`;

      const group = document.createElement('div');
      group.className = 'day-group';
      group.appendChild(dayHeader);

      for (const ev of dayEvents) {
        const row = document.createElement('div');
        row.className = 'event';

        if (ev.image_url && isSafeHttpUrl(ev.image_url)) {
          const thumbLink = document.createElement('a');
          thumbLink.href = ev.image_url;
          thumbLink.target = '_blank';
          thumbLink.rel = 'noopener';
          const thumbImg = document.createElement('img');
          thumbImg.className = 'thumb';
          thumbImg.src = ev.image_url;
          thumbImg.alt = '';
          thumbImg.loading = 'lazy';
          thumbImg.addEventListener('mouseenter', () => showImgPreview(thumbImg, ev.image_url));
          thumbImg.addEventListener('mouseleave', hideImgPreview);
          thumbLink.appendChild(thumbImg);
          row.appendChild(thumbLink);
        }

        const info = document.createElement('div');
        info.className = 'event-info';

        // Riga testuale con icona + titolo affiancati
        const headerRow = document.createElement('div');
        headerRow.className = 'event-header';

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = ICONS[ev.type] || '•';
        headerRow.appendChild(icon);

        const link = document.createElement('a');
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = ev.title;
        link.href = isSafeHttpUrl(ev.source_url) ? ev.source_url : '#';
        headerRow.appendChild(link);

        info.appendChild(headerRow);

        // Tag a scomparsa in hover
        if (Array.isArray(ev.tags) && ev.tags.length > 0) {
          const tagsRow = document.createElement('div');
          tagsRow.className = 'event-tags';
          for (const tagSlug of ev.tags) {
            const badge = document.createElement('span');
            badge.className = 'tag';
            badge.textContent = formatTagLabel(tagSlug);
            tagsRow.appendChild(badge);
          }
          info.appendChild(tagsRow);
        }

        row.appendChild(info);
        group.appendChild(row);
      }

      container.appendChild(group);
    }
  }

  // --- Filtri ---
  let currentEvents = [];
  const activeTypes = new Set(Object.keys(ICONS));   // tutti i type attivi di default
  const activeTagSlugs = new Set();                  // nessun tag = nessun filtro sui tag

  const typeFiltersEl = document.getElementById('typeFilters');
  const tagPanelEl = document.getElementById('tagPanel');
  const tagToggleEl = document.getElementById('tagToggle');
  const clearFiltersEl = document.getElementById('clearFilters');

  for (const [type, icon] of Object.entries(ICONS)) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.type = 'button';
    btn.textContent = icon;
    btn.title = type;
    btn.setAttribute('aria-label', `toggle ${type}`);
    btn.addEventListener('click', () => {
      if (activeTypes.has(type)) {
        activeTypes.delete(type);
        btn.classList.remove('active');
      } else {
        activeTypes.add(type);
        btn.classList.add('active');
      }
      updateClearVisibility();
      renderFiltered();
    });
    typeFiltersEl.appendChild(btn);
  }

  for (const [slug, label] of Object.entries(TAG_LABELS)) {
    const chip = document.createElement('button');
    chip.className = 'tag-chip';
    chip.type = 'button';
    chip.textContent = label;
    chip.addEventListener('click', () => {
      if (activeTagSlugs.has(slug)) {
        activeTagSlugs.delete(slug);
        chip.classList.remove('active');
      } else {
        activeTagSlugs.add(slug);
        chip.classList.add('active');
      }
      updateTagToggleLabel();
      updateClearVisibility();
      renderFiltered();
    });
    tagPanelEl.appendChild(chip);
  }

  tagToggleEl.addEventListener('click', (e) => {
    e.stopPropagation();
    const isHidden = tagPanelEl.hidden;
    tagPanelEl.hidden = !isHidden;
    tagToggleEl.setAttribute('aria-expanded', String(isHidden));
  });

  document.addEventListener('click', (e) => {
    if (tagPanelEl.hidden) return;
    const clickedInsidePanel = tagPanelEl.contains(e.target);
    if (!clickedInsidePanel) {
      tagPanelEl.hidden = true;
      tagToggleEl.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !tagPanelEl.hidden) {
      tagPanelEl.hidden = true;
      tagToggleEl.setAttribute('aria-expanded', 'false');
      tagToggleEl.focus();
    }
  });

  clearFiltersEl.addEventListener('click', () => {
    activeTagSlugs.clear();
    for (const type of Object.keys(ICONS)) activeTypes.add(type);
    typeFiltersEl.querySelectorAll('.filter-btn').forEach((b) => b.classList.add('active'));
    tagPanelEl.querySelectorAll('.tag-chip').forEach((c) => c.classList.remove('active'));
    updateTagToggleLabel();
    updateClearVisibility();
    renderFiltered();
  });

  function updateTagToggleLabel() {
    const n = activeTagSlugs.size;
    tagToggleEl.textContent = n > 0 ? `tags (${n}) ▾` : 'tags ▾';
    tagToggleEl.classList.toggle('has-selection', n > 0);
  }

  function updateClearVisibility() {
    const allTypesActive = activeTypes.size === Object.keys(ICONS).length;
    clearFiltersEl.hidden = allTypesActive && activeTagSlugs.size === 0;
  }

  function applyFilters(events) {
    return events.filter((ev) => {
      if (!activeTypes.has(ev.type)) return false;
      if (activeTagSlugs.size > 0) {
        const tags = Array.isArray(ev.tags) ? ev.tags : [];
        if (!tags.some((t) => activeTagSlugs.has(t))) return false;
      }
      return true;
    });
  }

  function renderFiltered() {
    render(applyFilters(currentEvents));
  }

  async function refresh() {
    currentEvents = await loadMonth(currentYear, currentMonth);
    renderFiltered();
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    refresh();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    refresh();
  });

  refresh();
</script>
</body>
</html>
