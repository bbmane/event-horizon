<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>releases.log</title>
<style>
  :root {
    --bg: #0d0b08;
    --bg-raised: #161310;
    --amber: #ffb000;
    --amber-dim: #8a6000;
    --amber-faint: #4a3d20;
    --text: #d8c9a3;
    --text-dim: #6b6155;
    --border: #2a2318;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    /* leggerissimo effetto scanline, non invasivo */
    background-image: repeating-linear-gradient(
      0deg,
      rgba(255, 176, 0, 0.012) 0px,
      rgba(255, 176, 0, 0.012) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 2rem;
  }

  .header .prompt {
    color: var(--amber-dim);
    font-size: 0.85rem;
  }

  .header h1 {
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--amber);
    letter-spacing: 0.02em;
  }

  .header h1::after {
    content: '_';
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .nav button:hover { border-color: var(--amber-dim); color: var(--amber); }
  .nav button:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }

  .nav .month-label {
    font-size: 1rem;
    color: var(--text);
    letter-spacing: 0.03em;
  }

  .day-group { margin-bottom: 1.6rem; }

  .day-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
  }

  .day-header .date-num { color: var(--text); }

  .day-header.is-today .date-num { color: var(--amber); font-weight: 600; }
  .day-header.is-today::before {
    content: '▸';
    color: var(--amber);
  }

  .day-header .rule {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .event {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.35rem 0 0.35rem 1.2rem;
    font-size: 0.92rem;
    border-left: 1px solid var(--border);
  }

  .event .thumb {
    width: 2rem;
    height: 2rem;
    object-fit: cover;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg-raised);
  }

  .event .icon {
    color: var(--amber-dim);
    width: 1.4rem;
    flex-shrink: 0;
  }

  .event a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px dotted var(--border);
  }

  .event a:hover { color: var(--amber); border-bottom-color: var(--amber-dim); }

  .event .tag {
    color: var(--text-dim);
    font-size: 0.75rem;
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 0.9rem;
    padding: 2rem 0;
    text-align: center;
    border: 1px dashed var(--border);
  }

  .footer-note {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.75rem;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .header h1::after { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>releases.log</h1>
    <span class="prompt">community-curated sci-fi & cyberpunk calendar</span>
  </div>

  <div class="nav">
    <button id="prevMonth" aria-label="Previous month">&larr; prev</button>
    <span class="month-label" id="monthLabel">—</span>
    <button id="nextMonth" aria-label="Next month">next &rarr;</button>
  </div>

  <div id="calendar"></div>

  <div class="footer-note">
    type → icon: game 🎮 · anime 📺 · movie 🎬 · series 📼 · manga 📖
    · <a href="../../issues/new?template=report-release.yml">report a release</a>
  </div>

</div>

<script>
  const ICONS = { game: '🎮', anime: '📺', movie: '🎬', series: '📼', manga: '📖' };
  const MONTHS = ['january','february','march','april','may','june','july',
                  'august','september','october','november','december'];

  const TODAY = new Date();
  TODAY.setHours(0, 0, 0, 0);
  let currentYear = TODAY.getFullYear();
  let currentMonth = TODAY.getMonth(); // 0-based

  function monthKey(year, month) {
    return `${year}-${String(month + 1).padStart(2, '0')}`;
  }

  function isToday(dateStr) {
    return dateStr === TODAY.toISOString().slice(0, 10);
  }

  function isPast(dateStr) {
    return new Date(dateStr) < TODAY && !isToday(dateStr);
  }

  async function loadMonth(year, month) {
    const key = monthKey(year, month);
    try {
      const resp = await fetch(`data/${key}.json`);
      if (!resp.ok) return [];  // file not generated yet for this month
      return await resp.json();
    } catch (err) {
      console.warn(`Could not load data/${key}.json`, err);
      return [];
    }
  }

  function render(events) {
    const label = document.getElementById('monthLabel');
    label.textContent = `${MONTHS[currentMonth]} ${currentYear}`;

    const container = document.getElementById('calendar');
    container.innerHTML = '';

    if (events.length === 0) {
      container.innerHTML = '<div class="empty-state">no releases logged for this month</div>';
      return;
    }

    const byDay = {};
    for (const ev of events) {
      (byDay[ev.date] ||= []).push(ev);
    }

    for (const [dateStr, dayEvents] of Object.entries(byDay).sort()) {
      const d = new Date(dateStr);
      const dayNum = d.getDate();
      const today = isToday(dateStr);

      const dayHeader = document.createElement('div');
      dayHeader.className = 'day-header' + (today ? ' is-today' : '');
      dayHeader.innerHTML = `<span class="date-num">${String(dayNum).padStart(2,'0')}</span>
        <span class="rule"></span>`;

      const group = document.createElement('div');
      group.className = 'day-group';
      group.appendChild(dayHeader);

      for (const ev of dayEvents) {
        const row = document.createElement('div');
        row.className = 'event';
        const thumb = ev.image_url
          ? `<a href="${ev.image_url}" target="_blank" rel="noopener"><img class="thumb" src="${ev.image_url}" alt="" loading="lazy" onerror="this.parentElement.outerHTML='<span class=&quot;icon&quot;>${ICONS[ev.type] || '•'}</span>'"></a>`
          : `<span class="icon">${ICONS[ev.type] || '•'}</span>`;
        row.innerHTML = `
          ${thumb}
          <a href="${ev.source_url}" target="_blank" rel="noopener">${ev.title}</a>
        `;
        group.appendChild(row);
      }

      container.appendChild(group);
    }
  }

  async function refresh() {
    const events = await loadMonth(currentYear, currentMonth);
    render(events);
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    refresh();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    refresh();
  });

  refresh();
</script>
</body>
</html>
