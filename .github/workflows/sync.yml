name: Sync approved releases

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 6 * * *"   # rete di sicurezza giornaliera alle 6:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sync issue -> data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_issues.py

      - name: Commit and push
        run: |
          git config user.name "release-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "Sync approved releases $(date +%F)"
          git push
