name: Sync approved releases

on:
  issues:
    types: [labeled, opened, edited]
  schedule:
    - cron: "0 6 * * *"   # rete di sicurezza giornaliera alle 6:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Sync issue -> data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_issues.py

      - name: Commit and push
        run: |
          git config user.name "release-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "Sync approved releases $(date +%F)"
          git push

# Add this job alongside the existing "sync" job in .github/workflows/sync.yml.
# It only runs on the "labeled" issue event (not on schedule/dispatch), and only
# does work when the label added is "approved" — see guard_labels.py.

  guard-approved-label:
    if: github.event_name == 'issues' && github.event.action == 'labeled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Guard approved label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python guard_labels.py

# Runs on "opened" (a submitter deletes the "[Release] "/"[Correction] "
# title prefix thinking it's a placeholder) and "edited" (the prefix gets
# removed later) — see guard_title.py for the restore logic.

  guard-title-prefix:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Guard title prefix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python guard_title.py
