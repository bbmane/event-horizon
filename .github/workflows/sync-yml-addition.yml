# Add this job alongside the existing "sync" job in .github/workflows/sync.yml.
# It only runs on the "labeled" issue event (not on schedule/dispatch), and only
# does work when the label added is "approved" — see guard_labels.py.

  guard-approved-label:
    if: github.event_name == 'issues' && github.event.action == 'labeled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Guard approved label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python guard_labels.py
