name: Merge tags

on:
  workflow_dispatch:
    inputs:
      old_id:
        description: "ID of the tag to retire"
        required: true
      new_id:
        description: "ID of the tag to merge it into"
        required: true

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge tags
        run: python tools/merge_tags.py "${{ github.event.inputs.old_id }}" "${{ github.event.inputs.new_id }}"

      - name: Commit and push
        run: |
          git config user.name "release-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "Merge tag ${{ github.event.inputs.old_id }} into ${{ github.event.inputs.new_id }}"
          git push
