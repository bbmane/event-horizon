name: "Submit a release"
description: "Suggest a sci-fi / cyberpunk movie, series, anime, game, manga, or album for the calendar."
title: "[Release]"
labels: ["pending"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Movie
        - TV Series
        - Anime
        - Video Game
        - Manga
        - Album
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Release date
      description: "Format: YYYY-MM-DD. If you only know the month, use the 1st (e.g. 2026-11-01)."
      placeholder: "2026-11-25"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Source link
      description: "Official page, store listing, AniList/Steam/MangaDex/IMDb, trailer, announcement."
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Cover / poster image URL (optional)
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: tags
    attributes:
      label: "Sci-Fi Tags & Themes"
      description: "Select all the tags, themes, and settings that apply to this work:"
      options:
        - label: "Aliens & First Contact"
        - label: "Biopunk & Genetic Engineering"
        - label: "Corporate Governments & Techno-Religions"
        - label: "Cyberpunk"
        - label: "Dystopian"
        - label: "Hard Sci-Fi"
        - label: "Kaiju & Tokusatsu"
        - label: "Mecha"
        - label: "Megastructures (Dyson spheres, orbital cities)"
        - label: "Mind Control, Collective Consciousness & Telepathy"
        - label: "Post-Apocalyptic & Alternative Histories"
        - label: "Space Opera & Interplanetary Warfare"
        - label: "Speculative Tech, Cybernetics, AI & Robotics"
        - label: "Steampunk & Retrofuturism"
        - label: "Time Travel & Space Exploration"
        - label: "Transhumanism, Post-humanism & Mind Uploading"
        - label: "Virtual Realities, Simulation & Multiverses"
    validations:
      required: true
