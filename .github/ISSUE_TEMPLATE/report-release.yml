name: "Submit a release"
description: "Suggest a sci-fi / cyberpunk movie, series, anime, game, manga, or album for the calendar."
title: "[Release] "
labels: ["pending"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Movie
        - TV Series
        - Anime
        - Video Game
        - Manga
        - Album
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Release date
      description: "Format: YYYY-MM-DD. If only the month is known, use the 1st (e.g. 2026-11-01) and say so in the notes."
      placeholder: "2026-11-15"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Source link
      description: "Official page, store listing, AniList/Steam/MangaDex/IMDb entry, trailer, announcement - anything that backs this up."
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Cover / poster image URL (optional)
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: tropes
    attributes:
      label: Sci-Fi & Cyberpunk Tropes
      description: "Select the core elements and themes defining this work:"
      options:
        - label: "Worldbuilding: futuristic, other worlds, subterranean Earth, parallel universes, interplanetary warfare, orbital cities, megastructures (Dyson spheres, Niven rings), simulated realities, virtual worlds, artificial multiverses"
        - label: "Alternative and/or future histories: evolution of humans on Earth or on other planets, post-humanism, transhumanism, mind uploading, ancient alien civilizations and cosmic ruins"
        - label: "Space travel and discoveries: interstellar voyages, teleportation, time travel, faster-than-light travel or communication, nanotechnology, gravitational manipulation, black hole exploration"
        - label: "Aliens and identities: extraterrestrials, mutants, androids, enhanced humans / cyborgs, hybrid societies of humans, AI, and alien species, alien ecologies and artificial biospheres"
        - label: "Speculative technologies: brain-computer interfaces, bio-engineering, superintelligent computers, robots, ray guns, programmable matter, replicators, augmented reality, altered perception"
        - label: "Political and social systems: utopian, dystopian, post-apocalyptic, post-post-apocalyptic, post-scarcity societies, interplanetary colonial secession and autonomy movements, corporate governments, techno-religions and futuristic cults"
        - label: "Mind and perception: mind control, telepathy, telekinesis, collective consciousness, multiple identities, artificial memories, new forms of communication (alien languages, artificial semiotics, total telepresence)"
    validations:
      required: true
