name: "Report a release"
description: "Suggest a sci-fi / cyberpunk movie, series, anime, game, manga, or album for the calendar."
title: "[Release] "
labels: ["pending"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Movie
        - TV Series
        - Anime
        - Video Game
        - Manga
        - Album
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Release date
      description: "Format: YYYY-MM-DD. If only the month is known, use the 1st (e.g. 2026-11-01) and say so in the notes."
      placeholder: "2026-11-15"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Source link
      description: "Official page, store listing, AniList/Steam/MangaDex/IMDb entry, trailer, announcement - anything that backs this up."
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Cover / poster image URL (optional)
      placeholder: "https://..."
    validations:
      required: false

  - type: checkboxes
    id: tropes
    attributes:
      label: Sci-Fi & Cyberpunk Tropes (Optional)
      description: "Select the key themes or elements present in this work:"
      options:
        - label: "Settings (futuristic, megastructures, simulated realities, parallel universes)"
        - label: "Alternative / Future Histories & Post-humanism (transhumanism, mind uploading, cosmic ruins)"
        - label: "Space travel & discoveries (interstellar voyages, FTL, nanotechnology, time travel)"
        - label: "Aliens, mutants & androids (cyborgs, hybrid societies, artificial biospheres)"
        - label: "Speculative technologies (brain-computer interfaces, bio-engineering, supercomputers)"
        - label: "Political & social systems (dystopian, post-apocalyptic, post-scarcity, corporate governments)"
        - label: "Mind & perception (telepathy, collective consciousness, artificial memories, alien semiotics)"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does this belong here?
      description: "A sentence or two on what makes it sci-fi/cyberpunk in spirit, not just by genre tag."
      placeholder: "e.g. near-future megacity setting, corporate dystopia, cybernetic augmentation as a core theme..."
    validations:
      required: true
