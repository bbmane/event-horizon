<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>submit // releases.log</title>
<style>
  :root {
    --bg: #0b0f12;
    --bg-raised: #11171d;
    --accent: #00f0ff;
    --accent-dim: #007780;
    --accent-faint: #123038;
    --text: #c5d8e0;
    --text-dim: #5c707a;
    --border: #1a2630;
    --err: #ff5c7a;
    --ok: #7dffb3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 16px;
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0, 240, 255, 0.01) 0px,
      rgba(0, 240, 255, 0.01) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.2rem;
    margin-bottom: 2.2rem;
  }

  .header .prompt { color: var(--accent-dim); font-size: 0.9rem; }

  .header h1 {
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .header h1::after { content: '_'; animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--accent-dim);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px dotted var(--accent-dim);
  }
  .back-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  form { display: flex; flex-direction: column; gap: 1.4rem; }

  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }

  .field .hint {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 0.3rem;
  }

  input[type="text"], input[type="url"], input[type="date"], select {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    padding: 0.6rem 0.7rem;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  fieldset { border: 1px solid var(--border); padding: 0.9rem 1rem; }
  legend { color: var(--text-dim); font-size: 0.85rem; padding: 0 0.4rem; }

  .tags {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem 1rem;
  }

  .tags label {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
  }

  .tags input { width: auto; margin-top: 0.2rem; accent-color: var(--accent-dim); }

  /* honeypot: hidden from real users, bots tend to fill everything */
  .hp { position: absolute; left: -9999px; top: -9999px; }

  button[type="submit"] {
    background: none;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: inherit;
    font-size: 1rem;
    padding: 0.7rem 1.2rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  button[type="submit"]:hover { border-color: var(--accent); background: var(--accent-faint); }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }

  .status {
    margin-top: 1rem;
    font-size: 0.9rem;
    border-left: 2px solid var(--border);
    padding-left: 0.8rem;
    display: none;
  }
  .status.ok { display: block; border-left-color: var(--ok); color: var(--ok); }
  .status.err { display: block; border-left-color: var(--err); color: var(--err); }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>submit</h1>
    <span class="prompt">add a release to the calendar</span>
  </div>

  <a class="back-link" href="index.html">&larr; back to calendar</a>

  <form id="releaseForm">
    <!-- honeypot field, must stay empty -->
    <div class="hp" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Neon Horizon 2" required maxlength="150">
    </div>

    <div class="field">
      <label for="type">Type</label>
      <select id="type" name="type" required>
        <option value="" disabled selected>select one</option>
        <option>Movie</option>
        <option>TV Series</option>
        <option>Anime</option>
        <option>Video Game</option>
        <option>Manga</option>
        <option>Album</option>
      </select>
    </div>

    <div class="field">
      <label for="date">Release date</label>
      <input type="date" id="date" name="date" required>
      <div class="hint">Se conosci solo il mese, usa il giorno 1.</div>
    </div>

    <div class="field">
      <label for="url">Source link</label>
      <input type="url" id="url" name="url" placeholder="https://..." required>
      <div class="hint">Pagina ufficiale, store, AniList/Steam/MangaDex/IMDb, trailer, annuncio.</div>
    </div>

    <div class="field">
      <label for="image">Cover / poster image URL (optional)</label>
      <input type="url" id="image" name="image" placeholder="https://...">
    </div>

    <fieldset>
      <legend>Sci-Fi Tags &amp; Themes</legend>
      <div class="tags" id="tagsGrid">
        <!-- populated by JS to keep labels in one place -->
      </div>
    </fieldset>

    <button type="submit" id="submitBtn">submit release</button>
    <div class="status" id="status"></div>
  </form>

</div>

<script>
  // IMPORTANT: replace with your deployed function URL
  // Cloudflare: https://event-horizon-submit.YOUR-SUBDOMAIN.workers.dev
  // Vercel:     https://YOUR-PROJECT.vercel.app/api/submit
  const WORKER_URL = 'https://YOUR-PROJECT.vercel.app/api/submit';

  const TAGS = [
    'Aliens & First Contact',
    'Biopunk & Genetic Engineering',
    'Corporate Governments & Techno-Religions',
    'Cyberpunk',
    'Dystopian',
    'Hard Sci-Fi',
    'Kaiju & Tokusatsu',
    'Mecha',
    'Megastructures (Dyson spheres, orbital cities)',
    'Mind Control, Collective Consciousness & Telepathy',
    'Post-Apocalyptic & Alternative Histories',
    'Space Opera & Interplanetary Warfare',
    'Speculative Tech, Cybernetics, AI & Robotics',
    'Steampunk & Retrofuturism',
    'Time Travel & Space Exploration',
    'Transhumanism, Post-humanism & Mind Uploading',
    'Virtual Realities, Simulation & Multiverses',
  ];

  const grid = document.getElementById('tagsGrid');
  TAGS.forEach((tag, i) => {
    const id = `tag_${i}`;
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" id="${id}" name="tags" value="${tag}"> ${tag}`;
    grid.appendChild(label);
  });

  const form = document.getElementById('releaseForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.className = 'status';
    statusEl.textContent = '';

    const data = new FormData(form);

    // honeypot check on the client too (server re-checks, this is just UX)
    if (data.get('website')) return;

    const payload = {
      title: data.get('title').trim(),
      type: data.get('type'),
      date: data.get('date'),
      url: data.get('url').trim(),
      image: data.get('image').trim(),
      tags: data.getAll('tags'),
      website: data.get('website'), // honeypot, should be empty
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'sending...';

    try {
      const resp = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();

      if (resp.ok && result.ok) {
        statusEl.className = 'status ok';
        statusEl.textContent = `✅ Inviato (issue #${result.issue_number}). Verrà rivisto e apparirà sul calendario una volta approvato.`;
        form.reset();
      } else {
        statusEl.className = 'status err';
        statusEl.textContent = `⚠️ ${result.error || 'Qualcosa è andato storto, riprova.'}`;
      }
    } catch (err) {
      statusEl.className = 'status err';
      statusEl.textContent = '⚠️ Impossibile contattare il server. Riprova più tardi.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'submit release';
    }
  });
</script>
</body>
</html>
