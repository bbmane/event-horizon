<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<title>Event.Horizon_</title>
<style>
  :root {
    --bg: #0b0f12;
    --bg-raised: #11171d;
    --accent: #00f0ff;
    --accent-dim: #04bac5;
    --accent-faint: #123038;
    --text: #c5d8e0;
    --text-dim: #cdcdcd;
    --text-hint: #595959;
    --border: #1a2630;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    overflow-y: scroll;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* vecchio Edge/IE */
  }
  html::-webkit-scrollbar { display: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 16px;
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
    padding-top: 1.5em;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0, 240, 255, 0.01) 0px,
      rgba(0, 240, 255, 0.01) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .wrap { max-width: 700px; margin: 0 auto; }

  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.4rem 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1rem;
  }

  .header h1 {
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .header h1::after {
    content: '_';
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .header .prompt {
    color: var(--accent-dim);
    font-size: 0.9rem;
  }

  @media (max-width: 520px) {
    .header {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
    }
  }

  .nav {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 1.5rem;
  }

  .nav-link {
    color: var(--accent-dim);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px dotted var(--accent-dim);
  }
  .nav-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* --- gallery --- */
  .gallery { margin-bottom: 2.5rem; }

  .gallery-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 0.9rem;
  }

  .gallery-title {
    font-size: 1rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .gallery-title::before { content: '▸ '; color: var(--accent-dim); }

  .gallery-count {
    font-size: 0.75rem;
    color: var(--text-hint);
  }

  .strip {
    display: flex;
    gap: 0.9rem;
    overflow-x: auto;
    padding-bottom: 0.6rem;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .card {
    flex: 0 0 150px;
    scroll-snap-align: start;
    color: var(--text);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: contain;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    transition: border-color 0.15s ease;
  }

  .card:hover .cover { border-color: var(--accent-dim); }
  .card:hover .name { color: var(--accent); }

  .name {
    font-size: 0.85rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color 0.15s ease;
  }

  .meta {
    font-size: 0.72rem;
    color: var(--text-hint);
  }
  .card.is-upcoming .meta { color: var(--accent-dim); }

  .empty-state {
    color: var(--text-dim);
    font-size: 1rem;
    padding: 2rem 0;
    text-align: center;
    border: 1px dashed var(--border);
  }

  /* --- footer (identico al calendario) --- */
  .footer-note {
    margin-top: 3.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.75rem;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .footer-note a {
    color: var(--accent-dim);
    text-decoration: none;
    border-bottom: 1px dotted var(--accent-dim);
  }
  .footer-note a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .header h1::after { animation: none; }
  }
</style>
<script>
  let showUnderscore = true;
  setInterval(() => {
    document.title = showUnderscore ? "Event.Horizon_" : "Event.Horizon";
    showUnderscore = !showUnderscore;
  }, 550); // Speed
</script>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>Event.Horizon</h1>
    <span class="prompt">hype-sharing, community-based, sci-fi cyber-feed</span>
  </div>

  <div class="nav">
    <a class="nav-link" href="index.html">calendar &rarr;</a>
  </div>

  <div id="galleries"></div>

  <div class="footer-note">
    <div>type icons: game 🎮 · anime 📺 · movie 🎬 · series 📼 · manga 📖 · comic 💥 · book 📚 · album 💽</div>
    <div>
      contribute: <a href="submit.html">submit a missing release</a>
      · <a href="https://github.com/bbmane/event-horizon/issues/new?template=report-correction.yml" target="_blank" rel="noopener">report a correction</a>
      · <a href="about.html">about</a>
    </div>
  </div>

</div>

<script>
  const ICONS = { game: '🎮', anime: '📺', movie: '🎬', series: '📼', manga: '📖', comic: '💥', book: '📚', album: '💽' };

  // Data di oggi in formato YYYY-MM-DD (ora locale, come in index.html).
  // Le date del catalogo sono nello stesso formato, quindi si confrontano come stringhe.
  const now = new Date();
  const TODAY_KEY = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

  function isSafeHttpUrl(value) {
    try {
      const u = new URL(value, window.location.href);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch {
      return false;
    }
  }

  function formatDate(key) {
    const [y, m, d] = key.split('-');
    return `${d}/${m}/${y}`;
  }

  async function loadJson(path, fallback) {
    try {
      const resp = await fetch(path, { cache: 'no-cache' });
      if (!resp.ok) return fallback;
      return await resp.json();
    } catch (err) {
      console.warn(`Could not load ${path}`, err);
      return fallback;
    }
  }

  function matchesSection(ev, section) {
    if (section.tag !== undefined && !(ev.tags || []).includes(section.tag)) return false;
    if (section.type !== undefined && ev.type !== section.type) return false;
    return true;
  }

  // Ordine: prima le uscite future (dalla più vicina), poi le passate (dalla più recente).
  // Con include_past: false restano solo le future.
  function selectEvents(catalog, section) {
    const limit = section.limit ?? 12;
    const candidates = catalog.filter((ev) => matchesSection(ev, section));

    const upcoming = candidates
      .filter((ev) => ev.date >= TODAY_KEY)
      .sort((a, b) => a.date.localeCompare(b.date));

    if (section.include_past === false) return upcoming.slice(0, limit);

    const past = candidates
      .filter((ev) => ev.date < TODAY_KEY)
      .sort((a, b) => b.date.localeCompare(a.date));

    return [...upcoming, ...past].slice(0, limit);
  }

  function makePlaceholder(ev) {
    const div = document.createElement('div');
    div.className = 'cover';
    div.textContent = ICONS[ev.type] || '•';
    return div;
  }

  function renderCard(ev) {
    const upcoming = ev.date >= TODAY_KEY;

    const a = document.createElement('a');
    a.className = 'card' + (upcoming ? ' is-upcoming' : '');
    a.href = isSafeHttpUrl(ev.source_url) ? ev.source_url : '#';
    a.target = '_blank';
    a.rel = 'noopener';

    let cover;
    if (ev.image_url && isSafeHttpUrl(ev.image_url)) {
      cover = document.createElement('img');
      cover.className = 'cover';
      cover.src = ev.image_url;
      cover.alt = '';
      cover.loading = 'lazy';
      cover.onerror = () => cover.replaceWith(makePlaceholder(ev));
    } else {
      cover = makePlaceholder(ev);
    }

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = ev.title;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${ICONS[ev.type] || '•'} ${formatDate(ev.date)}`;

    a.append(cover, name, meta);
    return a;
  }

  function renderSection(section, events) {
    const el = document.createElement('section');
    el.className = 'gallery';

    const head = document.createElement('div');
    head.className = 'gallery-head';

    const title = document.createElement('h2');
    title.className = 'gallery-title';
    title.textContent = section.title;

    const count = document.createElement('span');
    count.className = 'gallery-count';
    count.textContent = String(events.length);

    head.append(title, count);

    const strip = document.createElement('div');
    strip.className = 'strip';
    events.forEach((ev) => strip.appendChild(renderCard(ev)));

    el.append(head, strip);
    return el;
  }

    // Rotella verticale -> scroll orizzontale della gallery sotto il cursore.
  // Se la gallery è già a inizio/fine, la rotella torna a scorrere la pagina.
  // I trackpad che producono già scroll orizzontale non vengono toccati.
  document.getElementById('galleries').addEventListener('wheel', (e) => {
      const strip = e.target.closest('.strip');
      if (!strip) return;
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;

      // Firefox a volte manda il delta in righe invece che in pixel
      const delta = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
      const max = strip.scrollWidth - strip.clientWidth;
      const atStart = strip.scrollLeft <= 0 && delta < 0;
      const atEnd = strip.scrollLeft >= max - 1 && delta > 0;
      if (atStart || atEnd) return;

      e.preventDefault();
      strip.scrollLeft += delta;
    }, { passive: false });

  (async () => {
    const [catalog, config] = await Promise.all([
      loadJson('data/catalog.json', []),
      loadJson('data/home.json', { sections: [] }),
    ]);

    const root = document.getElementById('galleries');

    for (const section of config.sections || []) {
      const events = selectEvents(catalog, section);
      if (events.length === 0) continue; // nessuna release: niente gallery vuota
      root.appendChild(renderSection(section, events));
    }

    if (!root.children.length) {
      root.innerHTML = '<div class="empty-state">nothing on the horizon yet</div>';
    }
  })();
</script>
</body>
</html>
